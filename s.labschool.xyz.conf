# ============================================================
# Nginx Virtual Host: s.labschool.xyz
# Official Shortener & Bio Link Platform SMP Labschool Jakarta
# Server: srv-lmslabs-smpjkt (10.255.0.188)
# Supports Cloudflare Flexible (port 80) & Full SSL (port 443)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name s.labschool.xyz;
    root /var/www/s.labschool.xyz;
    index index.php index.html;

    ssl_certificate     /etc/ssl/certs/s.labschool.sch.id.crt;
    ssl_certificate_key /etc/ssl/certs/s.labschool.sch.id.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cloudflare Real IP Mapping
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/s.labschool.xyz.access.log;
    error_log  /var/log/nginx/s.labschool.xyz.error.log warn;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Static Assets Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Protect sensitive / hidden files
    location ~ /\.(env|git|htaccess|sql) {
        deny all;
        return 403;
    }

    # Microsite Public Handler (/p/slug atau /bio/slug)
    location ~* ^/(p|bio)/([a-zA-Z0-9_\-]+)/?$ {
        try_files $uri /bio.php?slug=$2&$args;
    }

    # Short URL Dynamic Redirector
    location / {
        try_files $uri $uri/ @short_redirect;
    }

    location @short_redirect {
        rewrite ^/([a-zA-Z0-9_\-]+)/?$ /redirect.php?slug=$1 last;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm/www-pensi.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        include fastcgi.conf;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 30;
    }
}
